<title id="title">공통 단면 SVG v1 — 씬3 상태</title>
<desc id="desc">원본 도해의 정면 좌표를 수동 추적한 검토용 벡터. 실제 제품 단면 아님. 받침은 보강 영역이며 MDF 형상은 미정. 기존 문선은 독립 그룹으로 숨김.</desc>
<metadata>Reference: KakaoTalk_Video_2026-10-13-13-29-25.mp4, scene3 at 8.8s; casing from 2s. Coordinates are approximate source pixels, not millimetres. No motion.</metadata>
